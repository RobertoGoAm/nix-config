[nav]
# Caps held: arrows + paging; warpd: Caps+M = hint, Caps+D = grid, Caps+C =
# normal (GNOME Alt+Super+x/d/c run warpd --hint/--grid/--normal). Colemak puts
# "d" on the physical g key, so grid triggers on g; c is unremapped.
h = left
j = down
k = up
l = right
y = home
p = end
u = pageup
o = pagedown
m = A-M-x
g = A-M-d
c = A-M-c

[sym]
# Right Alt held: digits, shifted symbols, brackets/punctuation.
a = 1
s = 2
d = 3
f = 4
g = 5
z = 6
x = 7
c = 8
v = 9
b = 0
q = S-1
w = S-2
e = S-3
r = S-4
t = S-5
y = S-6
u = S-7
i = S-8
o = S-9
p = S-0
h = minus
j = equal
k = leftbrace
l = rightbrace
semicolon = backslash
apostrophe = grave
n = S-minus
m = S-equal
comma = S-leftbrace
dot = S-rightbrace
slash = S-backslash
