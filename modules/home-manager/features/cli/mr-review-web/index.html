<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MRs">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>MRs</title>
<style>
:root {
  --bg: #e1e2e7; --surface: #d6d8e2; --raised: #c4c8da; --fg: #3760bf; --text: #343b58;
  --dim: #8990b3; --muted: #6172b0; --border: #a8aecb; --accent: #2e7de9;
  --green: #587539; --red: #f52a65; --yellow: #8c6c3e;
  --add: rgba(88,117,57,.13); --del: rgba(245,42,101,.11); --sel: rgba(46,125,233,.2);
  --c0: #e9e9ed; --c1: #f52a65; --c2: #587539; --c3: #8c6c3e; --c4: #2e7de9; --c5: #9854f1; --c6: #007197; --c7: #6172b0;
  --c8: #a1a6c5; --c9: #f52a65; --c10: #587539; --c11: #8c6c3e; --c12: #2e7de9; --c13: #9854f1; --c14: #007197; --c15: #3760bf;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #24283b; --surface: #1f2335; --raised: #292e42; --fg: #c0caf5; --text: #c0caf5;
    --dim: #565f89; --muted: #737aa2; --border: #3b4261; --accent: #7aa2f7;
    --green: #9ece6a; --red: #f7768e; --yellow: #e0af68;
    --add: rgba(158,206,106,.12); --del: rgba(247,118,142,.12); --sel: rgba(122,162,247,.22);
    --c0: #1d202f; --c1: #f7768e; --c2: #9ece6a; --c3: #e0af68; --c4: #7aa2f7; --c5: #bb9af7; --c6: #7dcfff; --c7: #a9b1d6;
    --c8: #414868; --c9: #f7768e; --c10: #9ece6a; --c11: #e0af68; --c12: #7aa2f7; --c13: #bb9af7; --c14: #7dcfff; --c15: #c0caf5;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overflow-x: hidden; }
button { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
button.plain { background: none; border: none; padding: 6px 8px; color: var(--accent); }
button:disabled { opacity: .45; }
a { color: var(--accent); text-decoration: none; }
select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; width: 100%; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
  padding: calc(env(safe-area-inset-top) + 6px) 12px 8px; display: flex; align-items: center; gap: 8px; }
.top .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-size: 12px; color: var(--dim); font-weight: 400; }
.page { padding: 10px 12px calc(env(safe-area-inset-bottom) + 90px); }
.group { margin: 14px 2px 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.mr .t { font-weight: 600; margin: 2px 0 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--dim); align-items: center; }
.chip { font-size: 12px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); }
.ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--yellow); } .acc { color: var(--accent); }
.add { color: var(--green); } .del { color: var(--red); }
.ref { color: var(--dim); font-size: 12.5px; }
.draftmark { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--dim); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.row button { flex: 1 1 auto; }
.file { display: flex; align-items: center; gap: 10px; }
.file .st { width: 14px; font-weight: 700; font-size: 13px; }
.file .p { flex: 1; min-width: 0; }
.file .n { font-weight: 600; overflow-wrap: anywhere; }
.file .d { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.file.read { opacity: .55; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
details summary { color: var(--accent); padding: 4px 0; }
.progress { height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; margin: 6px 0 2px; }
.progress > div { height: 100%; background: var(--green); }
.diff { font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; margin: 0 -12px; }
.hunk { color: var(--dim); background: var(--surface); padding: 4px 12px; font-size: 11px; overflow-wrap: anywhere; }
.line { display: grid; grid-template-columns: 2.4em 2.4em 1.1em 1fr; align-items: start; min-height: 1.45em; }
.line .no { color: var(--dim); text-align: right; font-size: 10px; padding-top: 1px; padding-right: 3px; user-select: none; }
.line .sg { text-align: center; color: var(--dim); user-select: none; }
.line .code { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 10px; }
.line.plus { background: var(--add); } .line.plus .sg { color: var(--green); }
.line.minus { background: var(--del); } .line.minus .sg { color: var(--red); }
.line.sel { background: var(--sel); }
.line.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--sel); } }
.thread { margin: 4px 10px 8px 2.4em; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: 13.5px/1.4 -apple-system, system-ui, sans-serif; }
.thread.resolved { opacity: .6; }
.thread.draft { border-color: var(--accent); }
.note + .note { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
.note .h { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
.note .h b { color: var(--text); }
.note .b { white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.actions button { padding: 4px 10px; font-size: 13px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--border);
  padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px); display: flex; gap: 8px; }
.bar button { flex: 1; }
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); display: none; align-items: flex-end; }
.sheet.open { display: flex; }
.sheet .box { width: 100%; background: var(--bg); border-radius: 16px 16px 0 0; padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px); }
.sheet .label { font-size: 13px; color: var(--dim); margin-bottom: 6px; overflow-wrap: anywhere; }
.sheet textarea { width: 100%; min-height: 130px; font: 16px/1.4 -apple-system, system-ui, sans-serif; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; resize: vertical; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 76px); z-index: 20; background: var(--raised);
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: none; }
.toast.show { display: block; } .toast.err { border-color: var(--red); }
.empty { color: var(--dim); padding: 30px 6px; text-align: center; }
.big { font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="box">
  <div class="label" id="sheet-label"></div>
  <textarea id="sheet-text" placeholder="Comment (markdown)"></textarea>
  <div class="row"><button id="sheet-cancel">Cancel</button><button class="primary" id="sheet-save">Save draft</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";

// --- shared with Herdr's MRs tab (mods/mrs/main.js): the same parsing, so the
// same lines, colours and read marks on both screens ---

const untab = (text) => text.replace(/[^\t]*\t/g, (s) => s.slice(0, -1).padEnd((s.length - 1) - (s.length - 1) % 4 + 4));

function parseDiff(text) {
  const rows = [];
  let o = 0, n = 0;
  for (const line of text.split("\n")) {
    const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/.exec(line);
    if (m) { o = +m[1]; n = +m[2]; rows.push({ kind: "hunk", text: line }); continue; }
    const sign = line[0];
    const text = untab(line.slice(1)) || " ";
    if (sign === "+") { rows.push({ kind: "line", sign, old: null, new: n, oc: o, nc: n, text }); n++; }
    else if (sign === "-") { rows.push({ kind: "line", sign, old: o, new: null, oc: o, nc: n, text }); o++; }
    else if (sign === " ") { rows.push({ kind: "line", sign, old: o, new: n, oc: o, nc: n, text }); o++; n++; }
  }
  return rows;
}

function colourRuns(raw) {
  const runs = [];
  let colour = null, bold = false, col = 0, last = 0;
  const add = (text) => {
    if (!text) return;
    let s = "";
    for (const ch of text) {
      if (ch === "\t") { const w = 4 - (col % 4); s += " ".repeat(w); col += w; } else { s += ch; col++; }
    }
    runs.push({ text: s, colour, bold });
  };
  for (const m of raw.matchAll(/\x1b\[([0-9;]*)m/g)) {
    add(raw.slice(last, m.index));
    last = m.index + m[0].length;
    for (const c of (m[1] || "0").split(";").map(Number)) {
      if (c === 38 || c === 48) break;
      if (c === 0) { colour = null; bold = false; }
      else if (c === 1) bold = true;
      else if (c === 22) bold = false;
      else if (c === 39) colour = null;
      else if (c >= 30 && c <= 37) colour = c - 30;
      else if (c >= 90 && c <= 97) colour = c - 82;
    }
  }
  add(raw.slice(last));
  return runs;
}

function digest(text) {
  let h = 5381;
  for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

// --- the page ---

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const S = { repos: [], repo: store.get("repo", null), list: null, listAt: 0, detail: null, detailAt: 0, sel: null, editing: null, busy: false };

function age(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}

function pipe(p) {
  return ({ success: ["✓", "ok"], passed: ["✓", "ok"], failed: ["✗", "bad"], running: ["●", "warn"], pending: ["○", "warn"], created: ["○", "warn"], canceled: ["⊘", ""], skipped: ["⊘", ""] })[p] ?? null;
}

const ref = (iid, forge) => `${forge === "github" ? "#" : "!"}${iid}`;

function toast(text, err = false) {
  const t = $("toast");
  t.textContent = text;
  t.className = `toast show${err ? " err" : ""}`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = "toast"; }, err ? 5000 : 2500);
}

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function change(args, done) {
  if (S.busy) return;
  S.busy = true;
  try {
    const r = await fetch("/api/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dir: S.repo, args }) });
    const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    if (done) toast(done);
    return j;
  } catch (e) {
    toast(e.message, true);
    return null;
  } finally {
    S.busy = false;
  }
}

// Routes: #  the list · #mr/IID  a request · #mr/IID/N  its Nth file.
function route() {
  const m = /^#mr\/(\d+)(?:\/(\d+))?/.exec(location.hash);
  return m ? { iid: +m[1], file: m[2] == null ? null : +m[2] } : { iid: null, file: null };
}

async function loadRepos() {
  try { S.repos = (await api("/api/repos")).repos; } catch (e) { S.repos = []; S.repoError = e.message; }
  if (!S.repos.some((r) => r.dir === S.repo)) S.repo = S.repos[0]?.dir ?? null;
}

async function loadList() {
  if (!S.repo) return;
  try { S.list = await api(`/api/list?dir=${encodeURIComponent(S.repo)}`); S.listError = null; S.listAt = Date.now(); }
  catch (e) { S.listError = e.message; }
}

async function loadDetail(iid) {
  try {
    S.detail = await api(`/api/show?dir=${encodeURIComponent(S.repo)}&iid=${iid}`);
    S.detailError = null;
    S.detailAt = Date.now();
  } catch (e) { S.detailError = e.message; }
}

const reads = () => S.detail?.state?.reads ?? {};
const isRead = (f) => reads()[f.new_path] === digest(f.diff ?? "");

// --- views ---

function header(title, sub, back) {
  return `<div class="top">${back ? `<button class="plain" onclick="history.back()" aria-label="Back">‹ Back</button>` : ""}
    <div class="title">${esc(title)}${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
    <button class="plain" onclick="refresh()" aria-label="Refresh">↻</button></div>`;
}

const GROUPS = [
  ["To review", (m) => m.review && !m.mine],
  ["Mine", (m) => m.mine],
  ["Others", (m) => !m.mine && !m.review],
];

function listView() {
  const repo = S.repos.find((r) => r.dir === S.repo);
  const options = S.repos.map((r) => `<option value="${esc(r.dir)}"${r.dir === S.repo ? " selected" : ""}>${esc(r.name)}</option>`).join("");
  let body = "";
  if (!S.repos.length) body = `<div class="empty">${esc(S.repoError || "No repositories: none of Herdr's terminals is in a checkout here.")}</div>`;
  else if (S.listError) body = `<div class="empty bad">${esc(S.listError)}</div>`;
  else if (!S.list) body = `<div class="empty">Loading…</div>`;
  else if (S.list.unsupported) body = `<div class="empty">This repository's forge isn't supported.</div>`;
  else if (!S.list.mrs.length) body = `<div class="empty">No open requests.</div>`;
  else for (const [label, test] of GROUPS) {
    const items = S.list.mrs.filter(test);
    if (!items.length) continue;
    body += `<div class="group">${label} · ${items.length}</div>`;
    for (const m of items) {
      const p = pipe(m.pipeline);
      body += `<div class="card mr" onclick="location.hash='#mr/${m.iid}'">
        <div class="meta"><span class="ref">${ref(m.iid, S.list.forge)}</span>${m.draft ? `<span class="draftmark">Draft</span>` : ""}<span>${esc(m.author)}</span><span style="margin-left:auto">${age(m.updated)}</span></div>
        <div class="t">${esc(m.title)}</div>
        <div class="meta">${p ? `<span class="${p[1]}">${p[0]} CI</span>` : ""}
          ${m.approved ? `<span class="ok">approved</span>` : m.approvals_left ? `<span>${m.approvals_left} to approve</span>` : ""}
          ${m.unresolved ? `<span class="warn">${m.unresolved} open</span>` : ""}
          <span class="add">+${m.add ?? 0}</span><span class="del">−${m.del ?? 0}</span><span>${m.files ?? ""} files</span></div></div>`;
    }
  }
  return header("Requests", repo?.name ?? "", false)
    + `<div class="page"><select onchange="pickRepo(this.value)">${options}</select>${body}</div>`;
}

function threadHtml(th, iid) {
  const status = th.resolvable ? (th.resolved ? `<span class="ok">resolved</span>` : `<span class="warn">open</span>`) : "";
  const notes = th.notes.map((n, k) => `<div class="note"><div class="h"><b>${esc(n.author)}</b> · ${age(n.created)} ${k === 0 ? status : ""}</div><div class="b">${esc(n.body)}</div></div>`).join("");
  const replies = (S.detail.drafts ?? []).filter((d) => d.reply_to === th.id).map((d) => draftHtml(d, true)).join("");
  return `<div class="thread${th.resolved ? " resolved" : ""}">${notes}
    <div class="actions"><button onclick="replyTo('${esc(th.id)}')">Reply</button>${th.resolvable ? `<button onclick="resolve('${esc(th.id)}', ${!th.resolved})">${th.resolved ? "Reopen" : "Resolve"}</button>` : ""}</div>${replies}</div>`;
}

function draftHtml(d, reply = false) {
  return `<div class="thread draft"${reply ? ` style="margin:6px 0 0"` : ""}><div class="note"><div class="h"><b class="acc">${reply ? "↳ your draft reply" : "Your draft"}</b> · not published yet</div><div class="b">${esc(d.body)}</div></div>
    <div class="actions"><button onclick="undraft('${esc(d.id)}')">Delete</button></div></div>`;
}

function mrView(iid) {
  const d = S.detail;
  if (!d || d.mr.iid !== iid) return header(ref(iid, S.list?.forge), "", true) + `<div class="page"><div class="empty${S.detailError ? " bad" : ""}">${esc(S.detailError || "Loading…")}</div></div>`;
  const mr = d.mr, forge = d.forge;
  const p = pipe(String(mr.pipeline).toLowerCase());
  const drafts = d.drafts ?? [];
  const open = (d.threads ?? []).filter((t) => t.resolvable && !t.resolved).length;
  const readN = d.files.filter(isRead).length;
  const pos = d.state?.pos;
  const posFile = pos?.path ? d.files.findIndex((f) => f.new_path === pos.path) : -1;
  const files = d.files.map((f, i) => {
    const rows = f.too_large ? [] : parseDiff(f.diff ?? "");
    const add = rows.filter((r) => r.sign === "+").length, del = rows.filter((r) => r.sign === "-").length;
    const here = (at) => at && (at.path === f.new_path || at.old_path === f.old_path);
    const threads = (d.threads ?? []).filter((t) => here(t.at)).length + drafts.filter((x) => here(x.at)).length;
    const parts = f.new_path.split("/");
    const cls = f.status === "A" ? "add" : f.status === "D" ? "del" : "warn";
    return `<div class="card file${isRead(f) ? " read" : ""}" onclick="location.hash='#mr/${iid}/${i}'">
      <div class="st ${cls}">${f.status}</div>
      <div class="p"><div class="n">${esc(parts.pop())}</div><div class="d">${esc(parts.join("/"))}</div></div>
      <div class="meta" style="flex-direction:column;align-items:flex-end;gap:0">${isRead(f) ? `<span class="ok">✓ read</span>` : ""}
        <span><span class="add">+${add}</span> <span class="del">−${del}</span></span>${threads ? `<span class="warn">💬 ${threads}</span>` : ""}</div></div>`;
  }).join("");
  const general = (d.threads ?? []).filter((t) => !t.at).map((t) => threadHtml(t, iid)).join("")
    + drafts.filter((x) => !x.at && !x.reply_to).map((x) => draftHtml(x)).join("");
  const canApprove = mr.can_approve && !mr.approved_by_me;
  return header(`${ref(mr.iid, forge)} ${mr.title}`, `${mr.author_name || mr.author}`, true) + `<div class="page">
    <div class="big">${esc(mr.title)}</div>
    <div class="meta" style="margin:6px 0">${esc(mr.source)} → ${esc(mr.target)}</div>
    <div class="meta">${p ? `<span class="chip ${p[1]}">${p[0]} CI</span>` : ""}
      ${mr.approved_by_me ? `<span class="chip ok">you approved</span>` : mr.approved ? `<span class="chip ok">approved</span>` : mr.approvals_left ? `<span class="chip">${mr.approvals_left} to approve</span>` : ""}
      ${open ? `<span class="chip warn">${open} open thread${open === 1 ? "" : "s"}</span>` : ""}
      ${drafts.length ? `<span class="chip acc">${drafts.length} draft${drafts.length === 1 ? "" : "s"}</span>` : ""}
      <span class="chip">${readN}/${d.files.length} read</span></div>
    <div class="progress"><div style="width:${d.files.length ? (100 * readN / d.files.length) : 0}%"></div></div>
    ${posFile >= 0 ? `<div class="row"><button class="primary" onclick="location.hash='#mr/${iid}/${posFile}'">Continue in ${esc(pos.path.split("/").pop())}${pos.new ?? pos.old ? `:${pos.new ?? pos.old}` : ""}</button></div>` : ""}
    <div class="row">
      ${drafts.length ? `<button class="primary" onclick="publish()">Publish ${drafts.length}</button>` : ""}
      ${canApprove ? `<button onclick="approve()">Approve</button>` : ""}
      ${mr.approved_by_me ? `<button onclick="unapprove()">Unapprove</button>` : ""}
      <button onclick="general()">Comment</button>
      <button onclick="window.open('${esc(mr.url)}', '_blank')">Open ↗</button></div>
    ${mr.description?.trim() ? `<details><summary>Description</summary><div class="card desc">${esc(mr.description)}</div></details>` : ""}
    <div class="group">Files · ${d.files.length}</div>${files}
    ${general ? `<div class="group">Conversation</div>${general}` : ""}</div>`;
}

function onLine(at, f, r) {
  return at && (at.path === f.new_path || at.old_path === f.old_path)
    && (at.new_line != null ? r.new === at.new_line : at.old_line != null && r.old === at.old_line && r.new == null);
}

function codeHtml(r, raw) {
  let runs = raw ? colourRuns(raw) : null;
  if (!runs || runs.map((x) => x.text).join("") !== r.text) return esc(r.text);
  return runs.map((x) => x.colour == null && !x.bold ? esc(x.text) : `<span style="${x.colour != null ? `color:var(--c${x.colour});` : ""}${x.bold ? "font-weight:700" : ""}">${esc(x.text)}</span>`).join("");
}

function fileView(iid, fi) {
  const d = S.detail;
  if (!d || d.mr.iid !== iid) return mrView(iid);
  const f = d.files[fi];
  if (!f) return mrView(iid);
  const threads = d.threads ?? [], drafts = d.drafts ?? [];
  const placed = new Set(), placedDrafts = new Set();
  let html = "";
  if (f.too_large || f.generated) {
    html = `<div class="empty">${f.too_large ? "Too large to show here." : "Generated file."} <a href="${esc(d.mr.url)}" target="_blank">Open the request ↗</a></div>`;
  } else {
    let oi = 0, ni = 0, li = 0;
    for (const r of parseDiff(f.diff ?? "")) {
      if (r.kind === "hunk") { html += `<div class="hunk">${esc(r.text)}</div>`; continue; }
      const raw = r.sign === "-" ? f.hl_old?.[oi] : f.hl_new?.[ni];
      if (r.sign !== "+") oi++;
      if (r.sign !== "-") ni++;
      const i = li++;
      const sel = S.sel && i >= S.sel.from && i <= S.sel.to;
      html += `<div class="line${r.sign === "+" ? " plus" : r.sign === "-" ? " minus" : ""}${sel ? " sel" : ""}" data-i="${i}" data-old="${r.old ?? ""}" data-new="${r.new ?? ""}" onclick="tapLine(${i})">
        <div class="no">${r.old ?? ""}</div><div class="no">${r.new ?? ""}</div><div class="sg">${r.sign === " " ? "" : r.sign}</div><div class="code">${codeHtml(r, raw)}</div></div>`;
      for (const th of threads) if (!placed.has(th.id) && onLine(th.at, f, r)) { placed.add(th.id); html += threadHtml(th, iid); }
      for (const dr of drafts) if (!dr.reply_to && !placedDrafts.has(dr.id) && onLine(dr.at, f, r)) { placedDrafts.add(dr.id); html += draftHtml(dr); }
    }
    const here = (at) => at && (at.path === f.new_path || at.old_path === f.old_path);
    const stray = threads.filter((t) => !placed.has(t.id) && here(t.at)).map((t) => threadHtml(t, iid)).join("")
      + drafts.filter((x) => !x.reply_to && !placedDrafts.has(x.id) && here(x.at)).map((x) => draftHtml(x)).join("");
    if (stray) html += `<div class="hunk">On lines no longer in the diff</div>${stray}`;
  }
  const read = isRead(f);
  const n = d.files.length;
  const bar = S.sel
    ? `<button onclick="clearSel()">✕</button><button class="primary" style="flex:3" onclick="comment()">Comment on ${S.sel.from === S.sel.to ? "line" : `${S.sel.to - S.sel.from + 1} lines`}</button>`
    : `<button ${fi === 0 ? "disabled" : ""} onclick="go(${fi - 1})">‹</button>
       <button style="flex:3" class="${read ? "" : "primary"}" onclick="markRead(${fi})">${read ? "Unmark read" : fi + 1 < n ? "Read · next ›" : "Read · done"}</button>
       <button ${fi + 1 >= n ? "disabled" : ""} onclick="go(${fi + 1})">›</button>`;
  return header(f.new_path.split("/").pop(), `${fi + 1}/${n} · ${f.new_path}`, true)
    + `<div class="page"><div class="diff" id="diff">${html}</div></div><div class="bar">${bar}</div>`;
}

// --- render and position ---

let lastKey = "";
function render(keepScroll = false) {
  const { iid, file } = route();
  const key = `${iid}/${file}`;
  const anchor = keepScroll ? topLine() : null;
  $("app").innerHTML = iid == null ? listView() : file == null ? mrView(iid) : fileView(iid, file);
  if (anchor) scrollToLine(anchor.old, anchor.new, false);
  else if (key !== lastKey) {
    window.scrollTo(0, 0);
    const pos = S.detail?.state?.pos;
    if (file != null && S.detail && pos?.path === S.detail.files[file]?.new_path) scrollToLine(pos.old, pos.new, true);
  }
  lastKey = key;
}

function topLine() {
  const head = document.querySelector(".top")?.getBoundingClientRect().bottom ?? 0;
  for (const el of document.querySelectorAll(".line")) {
    if (el.getBoundingClientRect().bottom > head + 4) return { old: el.dataset.old === "" ? null : +el.dataset.old, new: el.dataset.new === "" ? null : +el.dataset.new };
  }
  return null;
}

function scrollToLine(old, nu, flash) {
  const el = [...document.querySelectorAll(".line")].find((x) => (nu != null ? x.dataset.new === String(nu) : x.dataset.old === String(old)));
  if (!el) return;
  const head = document.querySelector(".top")?.getBoundingClientRect().height ?? 0;
  window.scrollTo(0, window.scrollY + el.getBoundingClientRect().top - head - 8);
  if (flash) el.classList.add("flash");
}

let posTimer = null;
window.addEventListener("scroll", () => {
  const { iid, file } = route();
  if (iid == null || file == null || !S.detail) return;
  clearTimeout(posTimer);
  posTimer = setTimeout(() => {
    const at = topLine();
    const f = S.detail?.files[file];
    if (!at || !f) return;
    const pos = { path: f.new_path, old: at.old, new: at.new };
    if (JSON.stringify(pos) === JSON.stringify(S.detail.state?.pos)) return;
    S.detail.state = { ...(S.detail.state ?? {}), pos };
    change(["pos", String(iid), JSON.stringify(pos)]);
  }, 1500);
}, { passive: true });

// --- actions ---

async function refresh() {
  const { iid } = route();
  toast("Refreshing…");
  await loadList();
  if (iid != null) await loadDetail(iid);
  render(true);
}

async function pickRepo(dir) {
  S.repo = dir;
  store.set("repo", dir);
  S.list = null;
  render();
  await loadList();
  render();
}

function go(fi) { location.replace(`#mr/${route().iid}/${fi}`); }

function tapLine(i) {
  if (!S.sel) S.sel = { anchor: i, from: i, to: i };
  else if (S.sel.from === S.sel.to && S.sel.from === i) S.sel = null;
  else S.sel = { anchor: S.sel.anchor, from: Math.min(S.sel.anchor, i), to: Math.max(S.sel.anchor, i) };
  render(true);
}

function clearSel() { S.sel = null; render(true); }

function lineArgs(f, r) {
  return [f.new_path, f.old_path, r.sign === "+" ? "" : String(r.old), r.sign === "-" ? "" : String(r.new)];
}

function openSheet(label, editing) {
  S.editing = editing;
  $("sheet-label").textContent = label;
  $("sheet-text").value = "";
  $("sheet").classList.add("open");
  setTimeout(() => $("sheet-text").focus(), 50);
}

function closeSheet() { $("sheet").classList.remove("open"); S.editing = null; }

function comment() {
  const { iid, file } = route();
  const f = S.detail.files[file];
  const rows = parseDiff(f.diff ?? "").filter((r) => r.kind === "line").slice(S.sel.from, S.sel.to + 1);
  const first = rows[0], last = rows[rows.length - 1];
  const end = (r) => ({ oc: r.oc, nc: r.nc, type: r.sign === "+" ? "new" : "old", old: r.sign === "+" ? null : r.old, new: r.sign === "-" ? null : r.new });
  const range = rows.length > 1 ? { start: end(first), end: end(last) } : null;
  const at = (r) => (r.sign === "-" ? `−${r.old}` : `${r.new}`);
  openSheet(`${f.new_path}:${rows.length > 1 ? `${at(first)}–${at(last)}` : at(last)}`,
    { args: ["comment", String(iid), null, ...lineArgs(f, last), ...(range ? [JSON.stringify(range)] : [])] });
}

function general() { openSheet("Comment on the whole request", { args: ["comment", String(route().iid), null] }); }

function replyTo(thread) { openSheet("Reply", { args: ["reply", String(route().iid), thread, null] }); }

async function save() {
  const body = $("sheet-text").value.trim();
  if (!body || !S.editing) return;
  const args = S.editing.args.map((a) => (a === null ? body : a));
  $("sheet-save").disabled = true;
  const ok = await change(args, "Draft saved. Publish sends your drafts.");
  $("sheet-save").disabled = false;
  if (!ok) return;
  closeSheet();
  S.sel = null;
  await loadDetail(route().iid);
  render(true);
}

async function after(r) {
  if (!r) return;
  await loadDetail(route().iid);
  render(true);
}

async function undraft(id) { if (confirm("Delete this draft?")) after(await change(["undraft", String(route().iid), id], "Draft deleted.")); }
async function resolve(id, to) { after(await change(["resolve", String(route().iid), id, String(to)], to ? "Resolved." : "Reopened.")); }

async function publish() {
  const n = S.detail.drafts.length;
  if (!confirm(`Publish ${n} draft${n === 1 ? "" : "s"}? Everyone on the request will see ${n === 1 ? "it" : "them"}.`)) return;
  after(await change(["submit", String(route().iid)], `Published ${n}.`));
}

async function approve() {
  const n = S.detail.drafts?.length ?? 0;
  if (S.detail.forge === "github" && n && !confirm(`Approve? GitHub publishes your ${n} draft${n === 1 ? "" : "s"} with the approval.`)) return;
  after(await change(["approve", String(route().iid)], "Approved."));
}

async function unapprove() { if (confirm("Take your approval back?")) after(await change(["unapprove", String(route().iid)], "Approval revoked.")); }

async function markRead(fi) {
  const iid = route().iid;
  const f = S.detail.files[fi];
  const was = isRead(f);
  const d = was ? "" : digest(f.diff ?? "");
  const st = await change(["read", String(iid), f.new_path, d]);
  if (!st) return;
  S.detail.state = st;
  if (was) { render(true); return; }
  const next = S.detail.files.findIndex((x, i) => i > fi && !isRead(x));
  const left = S.detail.files.filter((x) => !isRead(x)).length;
  if (next >= 0) go(next);
  else { toast(left ? `${left} unread before this one.` : `All ${S.detail.files.length} files read.`); location.hash = `#mr/${iid}`; }
}

$("sheet-cancel").onclick = closeSheet;
$("sheet-save").onclick = save;
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });

window.addEventListener("hashchange", async () => {
  S.sel = null;
  const { iid } = route();
  render();
  if (iid != null && (!S.detail || S.detail.mr.iid !== iid)) { await loadDetail(iid); render(); }
});

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || S.editing) return;
  const { iid } = route();
  if (Date.now() - S.listAt > 30000) await loadList();
  if (iid != null && Date.now() - S.detailAt > 30000) await loadDetail(iid);
  render(true);
});

setInterval(async () => {
  if (document.visibilityState !== "visible" || S.editing || route().iid != null) return;
  await loadList();
  render(true);
}, 120000);

(async () => {
  render();
  await loadRepos();
  render();
  await loadList();
  const { iid } = route();
  if (iid != null) await loadDetail(iid);
  render();
})();
</script>
</body>
</html>
