<!DOCTYPE html>
<meta charset="utf-8">
<title>Container Picker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1a1a1a; --muted: #5d5d5d; --line: #e0e0e0; --hover: #f0f0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b22; --fg: #f0f0f4; --muted: #b0b0bb; --line: #3a3944; --hover: #2a2a33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 560px; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  p.lede { margin: 0 0 16px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); padding: 0 0 4px;
  }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  td.container { display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18);
  }
  td.act { text-align: right; }
  button {
    font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  .empty { padding: 20px 0; color: var(--muted); text-align: center; }
</style>
<h1>Sites that no longer ask</h1>
<p class="lede">Each of these opens straight into its container when a link arrives from outside the browser. Forget one and it asks again.</p>
<table id="table" hidden>
  <thead><tr><th>Site</th><th>Container</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="empty" id="empty">Nothing remembered yet.</p>
<script src="options.js"></script>
