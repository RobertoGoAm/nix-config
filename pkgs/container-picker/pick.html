<!DOCTYPE html>
<meta charset="utf-8">
<title>Open in which container?</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1a1a1a; --muted: #5d5d5d; --line: #e0e0e0; --hover: #f0f0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b22; --fg: #f0f0f4; --muted: #b0b0bb; --line: #3a3944; --hover: #2a2a33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .target {
    margin: 0 0 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  }
  .target .host { display: block; font-weight: 600; }
  .target .url {
    display: block; color: var(--muted); font-size: 11.5px; word-break: break-all;
    max-height: 3.2em; overflow: hidden;
  }
  ul { list-style: none; margin: 0 0 14px; padding: 0; }
  li + li { margin-top: 4px; }
  button.pick {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: inherit; font: inherit; padding: 8px 10px; cursor: pointer;
  }
  button.pick:hover, button.pick:focus-visible { background: var(--hover); outline: none; }
  button.pick .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18);
  }
  button.pick .name { flex: 1; }
  button.pick kbd {
    font: inherit; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
  }
  label.remember {
    display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px;
  }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; }
</style>
<main>
  <h1>Open in which container?</h1>
  <p class="target"><span class="host" id="host"></span><span class="url" id="url"></span></p>
  <ul id="list"></ul>
  <label class="remember">
    <input type="checkbox" id="remember">
    <span>Always use this container for <span id="rememberHost">this site</span></span>
  </label>
  <p class="hint">Number keys choose. <kbd>Esc</kbd> opens with no container.</p>
</main>
<script src="pick.js"></script>
